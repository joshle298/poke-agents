name: 'Bug report'
description: 'Report a bug to help us improve Poke Agents.'
title: '[Bug]: '
labels: ['type: bug']
body:
  - type: textarea
    id: description
    attributes:
      label: 'Describe the bug'
      description: 'A clear and concise description of what the bug is.'
      placeholder: 'e.g., A working session shows as asleep.'
    validations:
      required: true

  - type: textarea
    id: reproduce
    attributes:
      label: 'Steps to reproduce'
      description: 'List exact steps to reproduce the behavior.'
      placeholder: |
        1. Run npm start
        2. Start a Conductor cloud session
        3. ...
    validations:
      required: true

  - type: textarea
    id: expected
    attributes:
      label: 'Expected behavior'
      description: 'What should happen?'
    validations:
      required: true

  - type: textarea
    id: actual
    attributes:
      label: 'Actual behavior'
      description: 'What happens instead? Include any error messages.'
    validations:
      required: true

  - type: textarea
    id: screenshots
    attributes:
      label: 'Screenshots / GIFs'
      description: 'If applicable, add screenshots or screen recordings. For agent tracking issues (stuck on idle, not spawning), include a screenshot of the **Debug View**: in the office, open Settings and toggle Debug View. **Note:** paths may contain your username -- redact anything sensitive before posting.'

  - type: input
    id: poke-agents-version
    attributes:
      label: 'Poke Agents commit and how you run it'
      description: 'Run `git rev-parse --short HEAD` in your clone, and say how you start it (npm start, npx, flags such as --claude).'
      placeholder: 'e.g., 1a2b3c4, npm start'
    validations:
      required: true

  - type: input
    id: claude-code-version
    attributes:
      label: 'Claude Code CLI version (with --claude only)'
      description: 'Run `claude --version` in your terminal.'
      placeholder: 'e.g., 2.1.78'

  - type: dropdown
    id: os
    attributes:
      label: 'Operating System'
      options:
        - Windows
        - macOS
        - Linux
        - WSL2
    validations:
      required: true

  - type: textarea
    id: logs
    attributes:
      label: 'Logs'
      description: "Paste the relevant output of the terminal running Poke Agents (lines start with `[Pixel Agents]`) and of the browser's developer console. **Note:** logs may contain file paths with your username -- redact anything sensitive before posting. Never paste your Conductor API key or the office URL's token."
      render: shell
